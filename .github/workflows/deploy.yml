name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The Heroku CLI ships with a git credential helper that authenticates to
      # git.heroku.com using $HEROKU_API_KEY directly — required for HRKU-prefixed
      # tokens, which Heroku's legacy email+token Basic-auth flow does not accept.
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      # Heroku's deploy branch is `master` regardless of what GitHub's default branch is named.
      - name: Push to Heroku
        run: |
          heroku git:remote -a softball-reference
          git push heroku HEAD:master
