name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Heroku's git endpoint authenticates via HTTP Basic where the username must be a real
      # Heroku account email (not a literal like "heroku" or "apikey"). ~/.netrc handles
      # special-character escaping in the email automatically, which an inline URL would not.
      - name: Configure Heroku credentials
        env:
          HEROKU_EMAIL: ${{ vars.HEROKU_EMAIL }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          cat > ~/.netrc <<EOF
          machine git.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          EOF
          chmod 600 ~/.netrc
      # Heroku's deploy branch is `master` regardless of what GitHub's default branch is named.
      - name: Push to Heroku
        run: git push https://git.heroku.com/softball-reference.git HEAD:master
